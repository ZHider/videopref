[project]
name = "videopref"
version = "0.1.0"
description = "个人视频喜好二分类器：冻结 DINOv3 骨干 + Masked Attention Pooling + 轻量 MLP 分类头"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "ZHider", email = "littlehider@gmail.com" },
]
keywords = ["video", "preference", "classification", "dinov3", "pytorch", "gradio"]
dependencies = [
    "gradio",          # GUI（拆帧 / 标注 / 推理 / 批量推理 / 工具 / 训练）
    "modelscope>=1.39.1",
    "numpy",
    "scikit-learn",    # AUC 评估
    "torch",           # 深度学习框架（cu128）
    "torchvision",     # 数据增强
    "tqdm>=4.70.0",    # CLI 进度条
    "transformers",    # DINOv3 骨干
]

[tool.uv.sources]
torch = [
  { index = "pytorch"},
]
torchaudio = [
  { index = "pytorch"},
]

[[tool.uv.index]]
name = "pytorch"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu128/"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
